<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segmentation Mask Drawing</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .controls {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Styles for interactive elements (buttons and select) */
        button, select {
            margin: 0 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f8f8f8;
            cursor: pointer;
        }

        /* Separate styles for the label - NO border or background */
        label {
            margin: 0 5px;
            padding: 10px 0; /* Adjust padding to align vertically */
            cursor: default;
        }
        
        select {
            min-width: 150px;
        }

        #canvas-wrapper {
            position: relative;
        }

        canvas {
            border: 1px solid black;
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    
<div class="main-container">
    <div id="controls-top" class="controls">
        <button id="undoButton">Undo</button>
        <button id="saveButton">Save</button>
        <button id="removeButton">Remove</button>
        <label for="classSelector">Class:</label>
        <select id="classSelector">
            {% for name, color in class_colors.items() %}
            <option value="{{ name }}">{{ name.replace('_', ' ').title() }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div id="canvas-wrapper">
        <canvas id="imageCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
    </div>
</div>

<script>
    const imageCanvas = document.getElementById('imageCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const controlsDiv = document.getElementById('controls-top');
    const canvasWrapper = document.getElementById('canvas-wrapper');
    const imageCtx = imageCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    const undoButton = document.getElementById('undoButton');
    const saveButton = document.getElementById('saveButton');
    const removeButton = document.getElementById('removeButton');
    const classSelector = document.getElementById('classSelector');

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let history = [];
    let currentImage = '';

    const classColors = {
    {% for name, color in class_colors.items() %}
        '{{ name }}': '{{ color }}',
    {% endfor %}
    };
    
    const scaleFactor = 2;
    const baseLineWidth = 15;

    // ensure drawn lines have exact specified RGB values
    drawCtx.imageSmoothingEnabled = false;

    function loadNextImage() {
        fetch('/next_image')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }
                currentImage = data.filename;
                const img = new Image();
                img.onload = function() {
                    const scaledWidth = img.width * scaleFactor;
                    const scaledHeight = img.height * scaleFactor;
                    
                    // Set canvas pixel dimensions
                    imageCanvas.width = scaledWidth;
                    imageCanvas.height = scaledHeight;
                    drawCanvas.width = scaledWidth;
                    drawCanvas.height = scaledHeight;

                    // Set the CSS dimensions of the canvases to match their pixel dimensions
                    imageCanvas.style.width = `${scaledWidth}px`;
                    imageCanvas.style.height = `${scaledHeight}px`;
                    drawCanvas.style.width = `${scaledWidth}px`;
                    drawCanvas.style.height = `${scaledHeight}px`;

                    // Set the wrapper's dimensions to match the canvases
                    canvasWrapper.style.width = `${scaledWidth}px`;
                    canvasWrapper.style.height = `${scaledHeight}px`;
                    
                    // Center the controls div by giving it the same width as the image
                    controlsDiv.style.width = `${scaledWidth}px`;

                    imageCtx.imageSmoothingEnabled = false;
                    imageCtx.drawImage(img, 0, 0, scaledWidth, scaledHeight);
                    
                    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    history = [drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height)];
                }
                img.src = `/images/${data.filename}`;
            });
    }

    function draw(e) {
        if (!isDrawing) return;
        const selectedClass = classSelector.value;
        drawCtx.strokeStyle = classColors[selectedClass];
        
        drawCtx.lineWidth = baseLineWidth * scaleFactor;
        
        drawCtx.lineJoin = 'round';
        drawCtx.lineCap = 'round';

        drawCtx.beginPath();
        drawCtx.moveTo(lastX, lastY);
        drawCtx.lineTo(e.offsetX, e.offsetY);
        drawCtx.stroke();
        [lastX, lastY] = [e.offsetX, e.offsetY];
    }
    
    function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = [e.offsetX, e.offsetY];
        saveState();
    }

    function endDrawing() {
        isDrawing = false;
    }

    function saveState() {
        history.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
        if (history.length > 10) history.shift();
    }

    function undoLast() {
        if (history.length > 1) {
            drawCtx.putImageData(history.pop(), 0, 0);
        }
    }

    function saveImage() {
        const selectedClass = classSelector.value;
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCanvas.width = drawCanvas.width;
        tempCanvas.height = drawCanvas.height;

        tempCtx.fillStyle = 'black';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

        tempCtx.drawImage(drawCanvas, 0, 0);

        tempCanvas.toBlob(blob => {
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64data = reader.result.split(',')[1];
                fetch('/save_segmentation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image_name: currentImage,
                        segmentation_data: base64data,
                        class_name: selectedClass,
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        classSelector.value = "{{ class_colors.keys()|first }}";
                        loadNextImage();
                    } else {
                        alert('Error saving segmentation');
                    }
                });
            };
            reader.readAsDataURL(blob);
        });
    }

    function removeImage() {
        fetch('/remove_image', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                image_name: currentImage,
            }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadNextImage();
            } else {
                alert('Error removing image');
            }
        });
    }

    undoButton.addEventListener('click', undoLast);
    saveButton.addEventListener('click', saveImage);
    removeButton.addEventListener('click', removeImage);

    drawCanvas.addEventListener('mousedown', (e) => {
        startDrawing(e);
        [lastX, lastY] = [e.offsetX, e.offsetY];
    });

    drawCanvas.addEventListener('mousemove', draw);
    drawCanvas.addEventListener('mouseup', endDrawing);
    drawCanvas.addEventListener('mouseout', endDrawing);

    drawCanvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = drawCanvas.getBoundingClientRect();
        startDrawing({
            offsetX: touch.clientX - rect.left,
            offsetY: touch.clientY - rect.top
        });
    });

    drawCanvas.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const rect = drawCanvas.getBoundingClientRect();
        draw({
            offsetX: touch.clientX - rect.left,
            offsetY: touch.clientY - rect.top
        });
        e.preventDefault();
    });

    drawCanvas.addEventListener('touchend', endDrawing);
    drawCanvas.addEventListener('touchcancel', endDrawing);

    window.onload = loadNextImage;
</script>

</body>
</html>
